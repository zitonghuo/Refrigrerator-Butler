[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-food-recognition"
version = "0.1.0"
description = "Image-based food recognition service for Fridge Butler"
requires-python = ">=3.10"
dependencies = [
  "clip-anytorch>=2.6.0",
  "gdown>=5.2.0",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "Pillow>=11.0",
  "PyYAML>=6.0",
  "ultralytics>=8.3.0,<9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
food-recognition = "food_recognition.__main__:main"
food-recognition-server = "food_recognition.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
